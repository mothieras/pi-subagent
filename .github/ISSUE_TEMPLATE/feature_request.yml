name: Feature request
description: Propose a concrete improvement before changing a public contract.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Keep proposals focused on a use case. Search existing issues and read the API contract first.
        Do not include credentials or private prompts/reports.
  - type: textarea
    id: problem
    attributes:
      label: Problem and use case
      description: Who needs this, and what is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain the observable outcome. Identify any parameters, permissions, lifecycle, usage, or compatibility changes.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or current workaround
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: How would we verify it?
      description: Suggest a bounded acceptance case, ideally without paid inference.
