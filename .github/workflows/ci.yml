name: CI

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node 24 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      PI_OFFLINE: "1"
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Prepare isolated Pi configuration
        run: |
          mkdir -p "$RUNNER_TEMP/pi-subagent-agent"
          echo "PI_CODING_AGENT_DIR=$RUNNER_TEMP/pi-subagent-agent" >> "$GITHUB_ENV"
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Type check
        run: npm run check
      - name: Run offline tests
        run: npm test
      - name: Check committed whitespace
        run: git diff --check HEAD^ HEAD
      - name: Verify checks leave the checkout clean
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            exit 1
          fi
